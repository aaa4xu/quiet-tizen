name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows catches CRLF and open-file problems that POSIX hosts never show.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # global.json pins the .NET 6 SDK; without it the runner's newer SDK would build.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # setup-python provides `python` on every runner; Windows has no `python3`.
      - name: Python tests and recipe syntax
        run: python -m unittest discover -s tests -v
      - name: Build open-source access payloads
        run: python tools/build.py payloads
      - name: Test Quiet Home logic without Samsung references
        run: dotnet test tests/QuietHome.Core.Tests
      - name: Check C# formatting against .editorconfig
        run: |
          dotnet format launcher/core/QuietHome.Core.csproj --verify-no-changes
          dotnet format tests/QuietHome.Core.Tests --verify-no-changes
