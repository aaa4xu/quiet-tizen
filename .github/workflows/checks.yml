name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows catches CRLF and open-file problems that POSIX hosts never show.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      # setup-python provides `python` on every runner; Windows has no `python3`.
      - name: Python tests and recipe syntax
        run: python -m unittest discover -s tests -v
      - name: Build open-source access payloads
        run: python tools/build.py payloads
      - name: Test native catalog logic without Samsung references
        run: dotnet run --project tests/CatalogTests.csproj -- launcher/assets/apps.json
